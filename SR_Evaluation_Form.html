<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SR Evaluation Form — Jan-May 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --navy: #1e3a5f;
    --teal: #0f766e;
    --light-teal: #ccfbf1;
    --gold: #f59e0b;
    --bg: #f0faf8;
    --white: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #c8ddd9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .page-header {
    background: linear-gradient(135deg, #0f4c3a 0%, var(--teal) 100%);
    padding: 28px 32px;
    color: white;
    box-shadow: 0 4px 20px rgba(15,118,110,0.35);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .page-header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.3px; }
  .page-header p { font-size: 0.82rem; opacity: 0.75; margin-top: 4px; }

  .meta-bar {
    background: white;
    padding: 16px 32px;
    display: flex;
    gap: 24px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .meta-bar label { font-size: 0.85rem; font-weight: 600; color: var(--navy); margin-right: 8px; }

  .meta-bar select, .meta-bar input {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 8px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: white;
    color: var(--text);
    min-width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }

  .meta-bar select:focus, .meta-bar input:focus { border-color: var(--teal); }

  .wrapper { padding: 24px 16px; overflow-x: auto; }

  .grid-table {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    min-width: 1100px;
  }

  .grid-head {
    display: grid;
    background: #0f4c3a;
    color: white;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.2px;
  }

  .grid-body-row {
    display: grid;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .grid-body-row:last-child { border-bottom: none; }
  .grid-body-row:hover { background: #f0fdfa; }

  .domain-cell {
    padding: 14px 16px;
    font-size: 0.86rem;
    font-weight: 500;
    line-height: 1.4;
    display: flex;
    align-items: center;
    border-right: 2px solid var(--light-teal);
    background: linear-gradient(to right, #f0fdfa, white);
  }

  .score-cell {
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-right: 1px solid var(--border);
  }

  .score-cell:last-child { border-right: none; }

  .candidate-header {
    padding: 12px 8px;
    text-align: center;
    font-size: 0.73rem;
    line-height: 1.3;
    border-right: 1px solid rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .candidate-header:last-child { border-right: none; }

  .score-display {
    font-family: 'DM Mono', monospace;
    font-size: 1.3rem;
    font-weight: 500;
    color: var(--navy);
    min-width: 32px;
    text-align: center;
    transition: color 0.2s;
    cursor: pointer;
  }

  .score-display.low { color: #dc2626; }
  .score-display.mid { color: #d97706; }
  .score-display.high { color: #059669; }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 5px;
    border-radius: 3px;
    background: var(--light-teal);
    outline: none;
    cursor: pointer;
    max-width: 100px;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--teal);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(15,118,110,0.4);
  }

  .domain-num {
    display: inline-block;
    background: var(--teal);
    color: white;
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 0.72rem;
    font-weight: 700;
    margin-right: 10px;
    flex-shrink: 0;
  }

  .total-row { background: #0f4c3a !important; }

  .total-row .domain-cell {
    background: #0f4c3a;
    color: white;
    font-weight: 700;
    border-right-color: rgba(255,255,255,0.2);
  }

  .total-score {
    font-family: 'DM Mono', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--gold);
  }

  .btn-row { padding: 24px 16px; display: flex; gap: 12px; flex-wrap: wrap; }

  .btn {
    padding: 12px 28px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .btn-primary { background: var(--teal); color: white; box-shadow: 0 4px 12px rgba(15,118,110,0.35); }
  .btn-primary:hover { background: #0f4c3a; transform: translateY(-1px); }
  .btn-reset { background: white; color: var(--navy); border: 1.5px solid var(--border); }
  .btn-reset:hover { background: var(--light-teal); }
  .btn-export { background: #1d4ed8; color: white; box-shadow: 0 4px 12px rgba(29,78,216,0.3); }
  .btn-export:hover { background: #1e3a8a; transform: translateY(-1px); }

  .legend {
    display: flex; gap: 16px; align-items: center;
    font-size: 0.78rem; color: var(--muted);
    padding: 0 16px 8px; flex-wrap: wrap;
  }

  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #0f4c3a; color: white;
    padding: 14px 22px; border-radius: 10px;
    font-size: 0.9rem; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    transform: translateY(100px); opacity: 0;
    transition: all 0.3s; z-index: 999;
  }

  .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="page-header">
  <h1>🏥 SR Evaluation Form — Session Jan–May 2026 (Version 1.0)</h1>
  <p>Submit your response after completing for one session. All candidates are visible for relative comparison.</p>
</div>

<div class="meta-bar">
  <div>
    <label>Evaluated By *</label>
    <select id="evaluator">
      <option value="">— Select Evaluator —</option>
      <option>Prof Sandeep Agarwala</option>
      <option>Prof Vishesh Jain</option>
      <option>Prof Anjan Dhua</option>
      <option>Prof Prabudh Goel</option>
      <option>Prof Devendra Kumar Yadav</option>
      <option>Dr. Ajay Verma</option>
      <option>Dr. Sachit Anand</option>
      <option>Dr. Gali Divya</option>
    </select>
  </div>
  <div>
    <label>Date *</label>
    <input type="date" id="eval-date">
  </div>
</div>

<div class="legend">
  <span><span class="legend-dot" style="background:#dc2626"></span>0–3 (Low)</span>
  <span><span class="legend-dot" style="background:#d97706"></span>4–6 (Moderate)</span>
  <span><span class="legend-dot" style="background:#059669"></span>7–10 (Good)</span>
  <span style="margin-left:auto;font-style:italic;">Drag slider or click number to type score</span>
</div>

<div class="wrapper">
  <div class="grid-table" id="main-grid"></div>
</div>

<div class="btn-row">
  <button class="btn btn-primary" onclick="window.print()">🖨️ Print / Save as PDF</button>
  <button class="btn btn-export" onclick="exportCSV()">📥 Export CSV</button>
  <button class="btn btn-reset" onclick="resetAll()">↺ Reset All Scores</button>
</div>

<div class="toast" id="toast"></div>

<script>
const candidates = [
  "Dr. Kiran MD",
  "Dr. Priyanjali Agarwal",
  "Dr. Shreya Agarwala",
  "Dr. Tirth Bharatkumar Shah",
  "Dr. Prateek Sethi",
  "Dr. Deepak Chandra Badhani",
  "Dr. Vinanti Naik",
  "Dr. Nikunj Nandan",
  "Dr. Sugandha Aggarwal",
  "Dr. Nidhi Patil",
  "Dr. Sakthi Devaneshwar",
  "Dr. Vivek Kumar Gautam",
];

const domains = [
  ["1", "Inter-personal Relation"],
  ["2", "Regularity"],
  ["3", "Participation in clinical and academic activities"],
  ["4", "Seminars"],
  ["5", "Journal Club"],
  ["6", "Ward work"],
  ["7", "Preparedness in OT"],
  ["8", "OT notes"],
  ["9", "File maintenance Notes"],
  ["10", "Paper presentation and participation in conference"],
  ["★", "Additional Remarks / Chief Thesis Guide Rating (if applicable)"],
];

const CORE = 10;
const domainW = 32;
const candW = (100 - domainW) / candidates.length;
const gridTemplate = `${domainW}% ` + candidates.map(() => `${candW.toFixed(2)}%`).join(' ');

const grid = document.getElementById('main-grid');

const head = document.createElement('div');
head.className = 'grid-head';
head.style.gridTemplateColumns = gridTemplate;

const domHead = document.createElement('div');
domHead.className = 'candidate-header';
domHead.innerHTML = '<span style="opacity:0.7;font-size:0.72rem;">Domain / Criteria</span>';
head.appendChild(domHead);

candidates.forEach(c => {
  const ch = document.createElement('div');
  ch.className = 'candidate-header';
  ch.textContent = c;
  head.appendChild(ch);
});
grid.appendChild(head);

const scores = {};
candidates.forEach(c => {
  scores[c] = {};
  domains.forEach(([num]) => scores[c][num] = 0);
});

function scoreClass(v) {
  if (v <= 3) return 'low';
  if (v <= 6) return 'mid';
  return 'high';
}

function updateTotal(candName) {
  let total = 0;
  for (let i = 0; i < CORE; i++) total += scores[candName][domains[i][0]] || 0;
  const el = document.getElementById(`total-${candName.replace(/[\s.]/g,'_')}`);
  if (el) el.textContent = total;
}

domains.forEach(([num, label], di) => {
  const row = document.createElement('div');
  row.className = 'grid-body-row';
  row.style.gridTemplateColumns = gridTemplate;
  if (di % 2 === 0) row.style.background = '#f0fdfa';

  const domCell = document.createElement('div');
  domCell.className = 'domain-cell';
  domCell.innerHTML = `<span class="domain-num">${num}</span><span>${label} <span style="color:#888;font-size:0.76rem;">(Out of 10)</span></span>`;
  row.appendChild(domCell);

  candidates.forEach(cand => {
    const sc = document.createElement('div');
    sc.className = 'score-cell';

    const key = `${num}-${cand.replace(/[\s.]/g,'_')}`;

    const disp = document.createElement('div');
    disp.className = `score-display ${scoreClass(0)}`;
    disp.id = `disp-${key}`;
    disp.textContent = '0';
    disp.addEventListener('click', function() {
      const val = prompt(`Score for ${cand} — ${label} (0-10):`, scores[cand][num]);
      if (val !== null) {
        const v = Math.min(10, Math.max(0, parseInt(val) || 0));
        scores[cand][num] = v;
        disp.textContent = v;
        disp.className = `score-display ${scoreClass(v)}`;
        const slider = document.getElementById(`slider-${key}`);
        if (slider) slider.value = v;
        updateTotal(cand);
      }
    });

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = 0; slider.max = 10; slider.step = 1; slider.value = 0;
    slider.id = `slider-${key}`;
    slider.addEventListener('input', function() {
      const v = parseInt(this.value);
      scores[cand][num] = v;
      disp.textContent = v;
      disp.className = `score-display ${scoreClass(v)}`;
      updateTotal(cand);
    });

    sc.appendChild(disp);
    sc.appendChild(slider);
    row.appendChild(sc);
  });

  grid.appendChild(row);
});

// Total row
const totalRow = document.createElement('div');
totalRow.className = 'grid-body-row total-row';
totalRow.style.gridTemplateColumns = gridTemplate;

const totalLabel = document.createElement('div');
totalLabel.className = 'domain-cell';
totalLabel.innerHTML = '<span style="font-weight:700;font-size:0.9rem;color:white;">TOTAL SCORE (out of 100)</span>';
totalRow.appendChild(totalLabel);

candidates.forEach(cand => {
  const tc = document.createElement('div');
  tc.className = 'score-cell';
  const ts = document.createElement('div');
  ts.className = 'total-score';
  ts.id = `total-${cand.replace(/[\s.]/g,'_')}`;
  ts.textContent = '0';
  tc.appendChild(ts);
  totalRow.appendChild(tc);
});
grid.appendChild(totalRow);

document.getElementById('eval-date').value = new Date().toISOString().split('T')[0];

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function resetAll() {
  if (!confirm('Reset all scores to 0?')) return;
  candidates.forEach(cand => {
    domains.forEach(([num]) => {
      scores[cand][num] = 0;
      const key = `${num}-${cand.replace(/[\s.]/g,'_')}`;
      const d = document.getElementById(`disp-${key}`);
      const s = document.getElementById(`slider-${key}`);
      if (d) { d.textContent = '0'; d.className = 'score-display low'; }
      if (s) s.value = 0;
    });
    updateTotal(cand);
  });
  showToast('All scores reset.');
}

function exportCSV() {
  const evaluator = document.getElementById('evaluator').value || 'Not specified';
  const date = document.getElementById('eval-date').value || 'Not specified';
  let csv = `SR Evaluation Form — Jan-May 2026\nEvaluated By,${evaluator}\nDate,${date}\n\n`;
  csv += `Domain,` + candidates.join(',') + '\n';
  domains.forEach(([num, label]) => {
    csv += `"${num}. ${label}",` + candidates.map(c => scores[c][num]).join(',') + '\n';
  });
  csv += `TOTAL,` + candidates.map(c => {
    let t = 0;
    for (let i = 0; i < CORE; i++) t += scores[c][domains[i][0]] || 0;
    return t;
  }).join(',') + '\n';

  const blob = new Blob([csv], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `SR_Evaluation_${date}.csv`;
  a.click();
  showToast('CSV exported!');
}
</script>
</body>
</html>
